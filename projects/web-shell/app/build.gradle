plugins { id 'com.android.application' }
android {
    namespace 'com.androidfactory.webshell'
    compileSdk 35
    defaultConfig {
        applicationId findProperty('factoryApplicationId') ?: 'com.androidfactory.webshell'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
