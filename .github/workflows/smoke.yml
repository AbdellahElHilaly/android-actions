name: Verify HTML Shelf APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run project tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          bash projects/html-shelf/tests/run.sh
      - name: Build HTML Shelf debug APK
        working-directory: projects/html-shelf
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Publish APK
        run: |
          mkdir -p dist
          cp projects/html-shelf/app/build/outputs/apk/debug/app-debug.apk dist/html-shelf-debug.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: html-shelf-debug-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14
