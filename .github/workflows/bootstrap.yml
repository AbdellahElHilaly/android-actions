name: Initialize Android Factory
on:
  push:
    branches: [main]
    paths:
      - 'factory-seed.tar.xz'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install complete factory source
        shell: bash
        run: |
          set -euo pipefail
          test -f factory-seed.tar.xz
          tar -xJf factory-seed.tar.xz
          test -f .github/workflows/build-apk.yml
          test -f projects/html-shelf/app/build.gradle
          rm factory-seed.tar.xz .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install Android APK factory source'
          git push origin HEAD:main
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check factory
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          bash projects/html-shelf/tests/run.sh
      - name: Build HTML Shelf debug APK
        working-directory: projects/html-shelf
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Publish HTML Shelf APK
        run: |
          mkdir -p dist
          cp projects/html-shelf/app/build/outputs/apk/debug/app-debug.apk dist/html-shelf-debug.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: html-shelf-debug-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14
